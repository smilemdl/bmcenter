<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>便岷中心</title>
    <style>
        html, body {
            height: 100%; /* 确保根元素高度占满窗口 */
        }
        body {
            display: flex;
            flex-direction: column; /* 垂直排列子元素 */
        }

        .my-button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .my-button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div style="background-color: #f1f1f1;
        text-align: center;
        padding: 20px;">
        <img style="width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;"
        src="https://photo.tuchong.com/17883430/f/49861890.jpg" 
        alt="logo">
    </div>
    <div style="flex: 1; padding: 20;">
        <div style="text-align: center;">
            <button>默认按钮</button>
        </div>
        <div style="text-align: center;">
            <button class="my-button" onclick="window.location.href='/hello'">
                点击我试试
          </button>
        </div>
    </div>
    <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
    <div style="background-color: #f1f1f1;
    text-align: center;
    padding: 20px;">
        &copy; 2025 便岷中心
    </div>
</body>
</html>
